name: CIPH static checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, ciph-public-release-checklist]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_script = False
                  self.external = False
                  self.parts = []
                  self.scripts = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      attrs = dict(attrs)
                      self.in_script = True
                      self.external = bool(attrs.get("src"))
                      self.parts = []

              def handle_data(self, data):
                  if self.in_script and not self.external:
                      self.parts.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.in_script:
                      if not self.external and "".join(self.parts).strip():
                          self.scripts.append("".join(self.parts))
                      self.in_script = False
                      self.external = False
                      self.parts = []

          html_files = sorted(Path(".").glob("*.html"))
          if not html_files:
              raise SystemExit("No root HTML files found.")
          out = Path("/tmp/ciph-inline")
          out.mkdir(exist_ok=True)
          total = 0
          for html_file in html_files:
              parser = Scripts()
              parser.feed(html_file.read_text(encoding="utf-8"))
              for i, script in enumerate(parser.scripts, start=1):
                  path = out / f"{html_file.stem}-script-{i}.js"
                  path.write_text(script, encoding="utf-8")
                  print(path)
                  total += 1
              print(f"{html_file}: {len(parser.scripts)} inline script block(s)")
          if total == 0:
              raise SystemExit("No inline JavaScript found in root HTML files.")
          print(f"Extracted {total} inline JavaScript block(s) from {len(html_files)} HTML files.")
          PY
          for file in /tmp/ciph-inline/*.js; do
            echo "Checking $file"
            node --check "$file"
          done


      - name: Check core CIPH feature markers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path("index.html").read_text(encoding="utf-8")
          checks = {
              "integrated headline feed": 'id="biasNews"',
              "directional verdict": 'id="biasVerdict"',
              "daily trading outlook": 'id="dailyOutlook"',
              "potential-results calculator": "Potential calculator",
              "username/profile discovery": "username",
              "public profile/template visibility": "is_public",
              "manual Instagram profile links": "instagram_url",
              "manual Discord profile links": "discord_url",
              "manual X profile links": "x_url",
              "account-scoped trade reads": '.eq("user_id",session.user.id)',
              "validated direct-chat RPC": "create_direct_conversation",
              "Forex Factory calendar link": "https://www.forexfactory.com/calendar",
              "Forex Factory news link": "https://calendar.forexfactory.com/news",
          }
          missing = [name for name, marker in checks.items() if marker not in source]
          if missing:
              raise SystemExit("Missing required CIPH feature marker(s): " + ", ".join(missing))
          print(f"Verified {len(checks)} core CIPH feature markers.")
          PY

      - name: Check manifest JSON
        run: python3 -m json.tool manifest.webmanifest > /dev/null

      - name: Reject recognizable Supabase server-side keys in tracked files
        shell: bash
        run: |
          if git grep -nE 'service_role_[A-Za-z0-9_-]{20,}|sb_secret_[A-Za-z0-9_-]{20,}' -- .; then
            echo "Potential Supabase server-side secret found in tracked files."
            exit 1
          fi
          echo "No recognizable Supabase service-role/secret key pattern found in tracked files."
